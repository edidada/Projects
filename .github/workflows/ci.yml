name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Visual Studio solutions (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v1
        with:
          nuget-version: "latest"

      - name: Restore and build all solutions
        shell: pwsh
        env:
          CI: "true"
        run: |
          $ErrorActionPreference = 'Continue'

          # .NET Framework reference assemblies for the frameworks used by the C#
          # projects (the runner has no 4.5.2 / 4.6 targeting packs installed).
          nuget install Microsoft.NETFramework.ReferenceAssemblies.net452 -Version 1.0.3 -ExcludeVersion -OutputDirectory .ci-ref 2>&1 | Out-Null
          nuget install Microsoft.NETFramework.ReferenceAssemblies.net46  -Version 1.0.3 -ExcludeVersion -OutputDirectory .ci-ref 2>&1 | Out-Null

          $fwMap = @{
            'v4.5.2' = 'Microsoft.NETFramework.ReferenceAssemblies.net452/build/.NETFramework/v4.5.2'
            'v4.6'   = 'Microsoft.NETFramework.ReferenceAssemblies.net46/build/.NETFramework/v4.6'
          }

          # Solutions requiring external native SDKs (OpenCV / Qt / MySQL) that the
          # GitHub runner cannot provide; they cannot be built in CI, so skip them.
          $excluded = @('OpenCVTest', 'TestOpenCV', 'QtGuiApplication1', 'C2MySQL_Demo')

          $solutions = Get-ChildItem -Recurse -Filter *.sln |
            Where-Object { $_.FullName -notmatch '\\\.vs\\' }

          $pass = 0
          $fail = 0
          $skip = 0
          $rows = @()

          foreach ($sln in $solutions) {
            if ($excluded -contains $sln.BaseName) {
              $rows += "| $($sln.Name) | :fast_forward: SKIPPED (external SDK) |"
              $skip++
              continue
            }
            Write-Host "::group::Build $($sln.Name)"

            nuget restore "$($sln.FullName)" -NonInteractive 2>&1 | Out-Null

            # For C# projects: point MSBuild at the NuGet reference assemblies so
            # legacy .NET Framework projects compile without targeting packs.
            $extra = @()
            $csproj = Get-ChildItem -Path $sln.DirectoryName -Recurse -Filter *.csproj | Select-Object -First 1
            if ($csproj) {
              $m = Select-String -Path $csproj.FullName -Pattern '<TargetFrameworkVersion>([^<]+)</TargetFrameworkVersion>' | Select-Object -First 1
              if ($m) {
                $tf = $m.Matches[0].Groups[1].Value
                if ($fwMap.ContainsKey($tf)) {
                  $fwPath = Join-Path '.ci-ref' ($fwMap[$tf])
                  Write-Host "Detected $tf -> FrameworkPathOverride=$fwPath"
                  $extra += "/p:FrameworkPathOverride=$fwPath"
                }
              }
            }

            & msbuild "$($sln.FullName)" `
              /nologo `
              /verbosity:minimal `
              /p:PlatformToolset=v143 `
              /p:WindowsTargetPlatformVersion=10.0 `
              @extra

            if ($LASTEXITCODE -eq 0) {
              $rows += "| $($sln.Name) | :white_check_mark: PASS |"
              $pass++
            } else {
              $rows += "| $($sln.Name) | :x: FAIL |"
              $fail++
            }
            Write-Host "::endgroup::"
          }

          $summary = @"
          # Build Report

          Total: **$($solutions.Count)**  Passed: **$pass**  Failed: **$fail**  Skipped: **$skip**

          | Solution | Result |
          | --- | --- |
          $($rows -join "`n")
          "@

          $summary | Out-File -Append $env:GITHUB_STEP_SUMMARY

          Write-Host ""
          Write-Host "Build report complete. Passed=$pass Failed=$fail Skipped=$skip"

          if ($fail -gt 0) {
            Write-Error "One or more buildable solutions failed to build."
            exit 1
          }
          exit 0
